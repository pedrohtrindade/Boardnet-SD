services:
  gateway:
    build: .
    command: uvicorn gateway:app --host 0.0.0.0 --port 8000
    environment:
      WORKER_URLS: http://worker1:8000,http://worker2:8000
      GATEWAY_DB: /data/gateway.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - gateway_data:/data
    depends_on:
      - worker1
      - worker2
  worker1:
    build: .
    command: uvicorn worker:app --host 0.0.0.0 --port 8000
    environment:
      SERVER_ID: Servidor 1
      WORKER_DB: /data/worker.sqlite3
    volumes:
      - worker1_data:/data
  worker2:
    build: .
    command: uvicorn worker:app --host 0.0.0.0 --port 8000
    environment:
      SERVER_ID: Servidor 2
      WORKER_DB: /data/worker.sqlite3
    volumes:
      - worker2_data:/data
volumes:
  gateway_data:
  worker1_data:
  worker2_data:
